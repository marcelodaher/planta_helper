name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The page is static: copy it plus the browser and wasm builds of cp-sat-wasm.
      - name: Assemble site
        run: |
          mkdir -p _site/node_modules/cp-sat-wasm/build/javascript
          cp index.html app.js solver-worker.js style.css generator.mjs engines.mjs layout.mjs samples.mjs _site/
          cp -R node_modules/cp-sat-wasm/build/javascript/browser _site/node_modules/cp-sat-wasm/build/javascript/
          mkdir -p _site/node_modules/cp-sat-wasm/build/javascript/wasm
          cp node_modules/cp-sat-wasm/build/javascript/wasm/cp_sat_runtime*.js \
             node_modules/cp-sat-wasm/build/javascript/wasm/cp_sat_runtime*.wasm \
             _site/node_modules/cp-sat-wasm/build/javascript/wasm/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
